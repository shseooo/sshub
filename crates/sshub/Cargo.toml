[package]
name = "sshub"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sshub-core.workspace = true
sshub-splits.workspace = true
sshub-terminal.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
futures.workspace = true
uuid.workspace = true

# 다중 모니터 전역 좌표 (`displays.rs`). gpui 0.2.2가 디스플레이 원점을 버려서
# CoreGraphics로 직접 구한다 — 버전은 gpui가 쓰는 것과 맞춘다.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[dev-dependencies]
ttf-parser = "0.25"
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
